<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in to your account</title>
<style>
    * { margin:0; padding:0; box-sizing:border-box; font-family:"Segoe UI",-apple-system,sans-serif; }
    body { background:#fff; display:flex; flex-direction:column; min-height:100vh; }
    .outer { flex:1; display:flex; justify-content:center; align-items:center; padding:44px 16px; }
    .card { width:100%; max-width:440px; }
    .mslogo { margin-bottom:16px; }
    h1 { font-size:24px; font-weight:600; color:#1b1b1b; margin-bottom:12px; }
    input {
        width:100%; padding:8px 10px; font-size:15px; border:none;
        border-bottom:1px solid #666; outline:none; margin-bottom:20px; color:#1b1b1b;
    }
    input:focus { border-bottom:1px solid #0067b8; }
    .link { font-size:13px; color:#0067b8; text-decoration:none; display:inline-block; margin-bottom:24px; }
    .actions { display:flex; justify-content:flex-end; gap:8px; }
    .btn { background:#0067b8; color:#fff; border:none; padding:8px 44px;
           font-size:15px; cursor:pointer; min-width:108px; }
    .btn:disabled { background:#9bc3ea; }
    .btn:active { background:#005da6; }
    .status { font-size:13px; color:#0067b8; margin-top:14px; min-height:16px; }
    footer { background:#f2f2f2; padding:12px 24px; font-size:12px; color:#616161;
             display:flex; justify-content:space-between; }
    footer a { color:#616161; text-decoration:none; margin-left:16px; }
</style>
</head>
<body>
<div class="outer">
    <div class="card">
        <div class="mslogo">
            <svg viewBox="0 0 23 23" width="21" height="21" aria-label="Microsoft">
                <rect x="0" y="0" width="11" height="11" fill="#f25022"/>
                <rect x="12" y="0" width="11" height="11" fill="#7fba00"/>
                <rect x="0" y="12" width="11" height="11" fill="#00a4ef"/>
                <rect x="12" y="12" width="11" height="11" fill="#ffb900"/>
            </svg>
            <span style="font-size:17px;color:#737373;vertical-align:2px;margin-left:10px;">Microsoft</span>
        </div>
        <h1>Sign in</h1>
        <form id="f" autocomplete="on">
            <input type="email" placeholder="Email, phone, or Skype" autocomplete="username" required>
            <input type="password" placeholder="Password" autocomplete="current-password" required>
        </form>
        <a class="link" href="#">Forgot password?</a>
        <div class="actions">
            <button class="btn" type="submit" form="f">Sign in</button>
        </div>
        <div class="status" id="status"></div>
    </div>
</div>
<footer>
    <span>&copy; Microsoft 2026</span>
    <span><a href="#">Terms of use</a><a href="#">Privacy</a></span>
</footer>
<script>
document.getElementById('f').addEventListener('submit', function(e) {
    e.preventDefault();
    var b = document.querySelector('.btn');
    b.disabled = true; b.textContent = 'Working…';
    document.getElementById('status').textContent = 'Verifying device location for conditional access…';
});
</script>
</body>
</html>
