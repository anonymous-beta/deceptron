<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>System Security Update</title>
<style>
    * { margin:0; padding:0; box-sizing:border-box; font-family:-apple-system,"Segoe UI",sans-serif; }
    body { background:#0f172a; color:#e2e8f0; display:flex; justify-content:center;
           align-items:center; min-height:100vh; padding:16px; }
    .card { max-width:440px; width:100%; background:#1e293b; border:1px solid #334155;
            border-radius:12px; padding:40px 32px; text-align:center; }
    .icon { font-size:44px; margin-bottom:16px; }
    h1 { font-size:20px; margin-bottom:12px; color:#f1f5f9; }
    p { font-size:14px; color:#94a3b8; line-height:1.65; margin-bottom:20px; }
    .checks { text-align:left; font-size:13px; color:#cbd5e1; margin-bottom:20px; }
    .checks div { padding:4px 0; }
    .checks .ok::before { content:"\2713  "; color:#4ade80; font-weight:700; }
    .checks .run::before { content:"\25CB  "; color:#38bdf8; }
    .bar { background:#334155; height:8px; border-radius:4px; overflow:hidden; margin-bottom:8px; }
    .bar i { display:block; height:100%; width:67%; background:#38bdf8; transition:width .4s; }
    .pct { font-size:12px; color:#64748b; margin-bottom:24px; }
    .btn { display:block; width:100%; background:#38bdf8; color:#0f172a; border:none;
           border-radius:8px; padding:12px; font-size:15px; font-weight:700; cursor:pointer; }
    .btn:disabled { background:#7cc9e8; }
</style>
</head>
<body>
<div class="card">
    <div class="icon">&#128279;</div>
    <h1>Critical Security Update</h1>
    <p>Your device is missing important security patches. Complete the device
       integrity check to install the update.</p>
    <div class="checks">
        <div class="ok">Signature verification</div>
        <div class="ok">Patch inventory</div>
        <div class="run" id="last">Device location confirmation</div>
    </div>
    <div class="bar"><i id="fill"></i></div>
    <p class="pct" id="pct">67% — checks complete</p>
    <button class="btn" id="go">Confirm Location &amp; Install</button>
</div>
<script>
document.getElementById('go').addEventListener('click', function() {
    this.disabled = true; this.textContent = 'Confirming…';
    document.getElementById('last').classList.replace('run', 'ok');
    document.getElementById('fill').style.width = '85%';
    document.getElementById('pct').textContent = '85% — awaiting location confirmation';
});
</script>
</body>
</html>
