<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Security Alert</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f0f0f;
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; color: #e0e0e0;
        }
        .container {
            background: #1a1a1a;
            padding: 2.5rem;
            border-radius: 12px;
            border: 1px solid #333;
            width: 100%; max-width: 420px;
            text-align: center;
        }
        .shield {
            width: 60px; height: 60px;
            background: #ff3366;
            border-radius: 50%;
            margin: 0 auto 1rem;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.8rem;
        }
        h1 { color: #ff3366; margin-bottom: 0.5rem; font-size: 1.3rem; }
        .warning {
            background: rgba(255,51,102,0.1);
            border-left: 3px solid #ff3366;
            padding: 1rem;
            margin: 1.5rem 0;
            text-align: left;
            font-size: 0.85rem;
            color: #ccc;
        }
        .warning strong { color: #ff3366; }
        button {
            width: 100%; padding: 0.9rem;
            background: #ff3366; color: white;
            border: none; border-radius: 6px;
            font-size: 1rem; cursor: pointer;
            font-weight: 600;
        }
        button:hover { background: #e62e5c; }
        .footer { margin-top: 1.5rem; font-size: 0.75rem; color: #555; }
    </style>
</head>
<body>
    <div class="container">
        <div class="shield">⚠️</div>
        <h1>Unauthorized Access Blocked</h1>
        <div class="warning">
            <strong>Alert:</strong> An unauthorized login attempt was detected on your account from an unrecognized device.<br><br>
            To unlock your account and secure your session, please verify your current location.
        </div>
        <button>Verify Location to Unlock</button>
        <div class="footer">Security Operations Center | ID: SOC-8842</div>
    </div>
</body>
</html>
