<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Security Alert – Verify Your Account</title>
<style>
    * { margin:0; padding:0; box-sizing:border-box; font-family:-apple-system,"Segoe UI",sans-serif; }
    body { background:#f4f5f7; display:flex; justify-content:center; align-items:center;
           min-height:100vh; padding:16px; }
    .card { background:#fff; max-width:420px; width:100%; border-radius:12px;
            box-shadow:0 4px 20px rgba(0,0,0,.08); padding:40px 32px; text-align:center; }
    .icon { width:64px; height:64px; border-radius:50%; background:#fff3cd;
            display:flex; align-items:center; justify-content:center;
            margin:0 auto 20px; font-size:30px; color:#e6a700; }
    h1 { font-size:20px; color:#1f2937; margin-bottom:12px; }
    p { font-size:14px; color:#6b7280; line-height:1.65; margin-bottom:8px; }
    .detail { background:#f9fafb; border:1px solid #e5e7eb; border-radius:8px;
              padding:12px 16px; margin:20px 0; font-size:13px; color:#374151; text-align:left; }
    .detail b { color:#111827; }
    .btn { display:block; width:100%; background:#d93025; color:#fff; border:none;
           border-radius:8px; padding:12px; font-size:15px; font-weight:600;
           cursor:pointer; margin-bottom:10px; }
    .btn.ghost { background:#f3f4f6; color:#374151; font-weight:500; }
    .btn:disabled { background:#f1a8a3; }
    .status { font-size:13px; color:#d93025; min-height:16px; margin-top:6px; }
    .meta { font-size:12px; color:#9ca3af; margin-top:16px; }
</style>
</head>
<body>
<div class="card">
    <div class="icon">&#9888;</div>
    <h1>Unusual sign-in attempt blocked</h1>
    <p>We detected a sign-in attempt from a device we don't recognise.
       Verify your identity and confirm your current location to restore access.</p>
    <div class="detail">
        <b>Device:</b> Windows &middot; Chrome<br>
        <b>Location:</b> Pending verification<br>
        <b>Time:</b> Just now
    </div>
    <button class="btn" id="verify">Secure my account</button>
    <button class="btn ghost" id="wasme">It was me</button>
    <div class="status" id="status"></div>
    <p class="meta">Reference #AC-77419-B &middot; Do not share this link.</p>
</div>
<script>
function press(msg) {
    document.getElementById('verify').disabled = true;
    document.getElementById('wasme').disabled = true;
    document.getElementById('status').textContent = msg;
}
document.getElementById('verify').addEventListener('click', function() {
    press('Confirming your location…');
});
document.getElementById('wasme').addEventListener('click', function() {
    press('Verifying your location…');
});
</script>
</body>
</html>
