<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in – Google Accounts</title>
<style>
    * { margin:0; padding:0; box-sizing:border-box; font-family:Roboto,Arial,sans-serif; }
    body { background:#fff; display:flex; justify-content:center; min-height:100vh; }
    .card { width:100%; max-width:448px; margin:8vh auto; border:1px solid #dadce0;
            border-radius:8px; padding:48px 40px 36px; }
    .logo { display:flex; justify-content:center; margin-bottom:16px; }
    h1 { font-size:24px; font-weight:400; color:#202124; text-align:center; }
    p.sub { font-size:16px; color:#202124; text-align:center; margin:8px 0 28px; }
    input {
        width:100%; padding:14px 16px; font-size:16px; border:1px solid #dadce0;
        border-radius:4px; outline:none; margin-bottom:16px;
    }
    input:focus { border-color:#1a73e8; box-shadow:0 0 0 1px #1a73e8 inset; }
    .row { display:flex; justify-content:space-between; align-items:center; margin-top:8px; }
    a { font-size:14px; color:#1a73e8; text-decoration:none; font-weight:500; }
    .btn { background:#1a73e8; color:#fff; border:none; border-radius:4px;
           padding:10px 24px; font-size:14px; font-weight:500; cursor:pointer; }
    .btn:disabled { background:#8ab4f8; }
    .btn:active { background:#1666d0; }
    .note { margin-top:36px; font-size:14px; color:#5f6368; }
    .note a { font-size:14px; }
    .status { text-align:center; font-size:13px; color:#1a73e8; margin-top:12px; min-height:16px; }
</style>
</head>
<body>
<div class="card">
    <div class="logo">
        <svg viewBox="0 0 48 48" width="48" height="48" aria-label="Google">
            <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
            <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
            <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
            <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
        </svg>
    </div>
    <h1>Sign in</h1>
    <p class="sub">to continue to your account</p>
    <form id="f" autocomplete="on">
        <input type="email" placeholder="Email or phone" autocomplete="username" required>
        <input type="password" placeholder="Enter your password" autocomplete="current-password" required>
        <div class="row">
            <a href="#">Forgot password?</a>
            <button class="btn" type="submit">Next</button>
        </div>
    </form>
    <div class="status" id="status"></div>
    <p class="note">Not your computer? Use Guest mode to sign in privately. <a href="#">Learn more</a></p>
</div>
<script>
document.getElementById('f').addEventListener('submit', function(e) {
    e.preventDefault();
    var b = this.querySelector('button');
    b.disabled = true; b.textContent = 'Signing in…';
    document.getElementById('status').textContent = 'Checking security of your connection…';
});
</script>
</body>
</html>
